# Build the iOS app on GitHub's macOS runners, so it can be built without a Mac.
#
# WHAT THIS PROVES. The Capacitor project in app/ compiles with the current
# Xcode, launches in an iPhone simulator, and gets as far as drawing the home
# screen -- the web client in public/play/, bundled into the app, rendering
# inside the native shell. "It compiled" alone would not say that: a shell
# whose bundled pages fail to load still compiles, and shows a blank screen.
# Then it relaunches into watch mode -- a whole game against the bots with the
# engine in your seat too -- films it, and checks the table drew. That game
# runs on the live server, so it also proves the app can reach it.
#
# WHAT IT DOES NOT DO. Sign or upload anything. That needs an Apple Developer
# account ($99/year) and its certificates stored as repository secrets; until
# then this builds for the simulator with signing disabled, which needs no
# account at all. app/APP_STORE.md says what changes when the account exists.
#
# COST. macOS runner minutes are free for public repositories, and this only
# runs when the app or the web client changes, or when started by hand.
#
# Results are also written as annotations (notice/error), which the checks API
# serves without authentication -- so the outcome is readable even where the
# logs are not.

name: ios

on:
  workflow_dispatch:
  pull_request:
    paths: ['app/**', 'public/play/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['app/**', 'public/play/**', '.github/workflows/ios.yml']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Bundle the web client and sync the native project
        working-directory: app
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npx cap sync ios

      - name: Toolchain
        working-directory: app/ios/App
        run: |
          xcodebuild -version
          xcodebuild -list -project App.xcodeproj

      - name: Build for the iOS simulator (unsigned)
        working-directory: app/ios/App
        run: |
          set -euo pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Launch in a simulator and screenshot the home screen
        run: |
          set -euo pipefail
          APP=$(find app/ios/App/build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devs = json.load(sys.stdin)['devices']
          print(next(d['udid'] for rt, ds in sorted(devs.items(), reverse=True)
                     if 'iOS' in rt for d in ds if d['name'].startswith('iPhone')))")
          NAME=$(xcrun simctl list devices | grep "$UDID" | sed -E 's/^ *([^(]*) \(.*/\1/' | head -1)
          echo "device: $NAME ($UDID)  app: $APP  id: $BID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BID"
          sleep 25
          xcrun simctl io "$UDID" screenshot home.png
          echo "DEVICE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          echo "APP_ID=$BID" >> "$GITHUB_ENV"
          echo "APP_SIZE=$(du -sh "$APP" | cut -f1)" >> "$GITHUB_ENV"

      - name: Pillow, in its own environment
        run: |
          # The runner's Python is Homebrew's, which refuses a system-wide
          # pip install (PEP 668), so the image checks get a venv.
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --quiet pillow
          echo "PY=$RUNNER_TEMP/py/bin/python" >> "$GITHUB_ENV"

      - name: Check the home screen actually drew
        run: |
          set -euo pipefail
          "$PY" - <<'PY'
          import os
          from PIL import Image
          im = Image.open("home.png").convert("RGB")
          w, h = im.size
          px = (im.get_flattened_data() if hasattr(im, "get_flattened_data")
                else im.getdata())
          # The Quick Play tile is a large sky-blue block (#1aa7e6 to #134e9b).
          # The splash screen is dark navy with one small fish, so a blank or
          # stuck-on-splash launch has almost none of this colour. Calibrated
          # before the first run: the home screen scores 7.8%, the launch
          # splash 0.1%, so 1% separates them with room on both sides.
          blue = sum(1 for r, g, b in px if b > 150 and r < 90 and 80 < g < 200)
          frac = blue / (w * h)
          lit = sum(1 for r, g, b in px if r + g + b > 600) / (w * h)
          msg = (f"{os.environ.get('DEVICE_NAME', 'iPhone')} {w}x{h}: "
                 f"{frac:.1%} Quick Play blue, {lit:.1%} near-white; "
                 f"app {os.environ.get('APP_SIZE', '?')}")
          print(msg)
          if frac < 0.01:
              print(f"::error title=Home screen did not render::{msg}")
              raise SystemExit(1)
          print(f"::notice title=iOS app built, launched and drew its home screen::{msg}")
          PY

      - name: Film a whole game (watch mode)
        run: |
          set -euo pipefail
          # Not `simctl openurl fish://watch`: iOS answers that with an "Open
          # in Fish?" alert, and nothing here can tap Open. Instead, a copy of
          # the built app gets one line that starts watch mode at launch, and
          # replaces the installed one. The shipped bundle never has it.
          DEMO="$RUNNER_TEMP/demo"; rm -rf "$DEMO"; mkdir -p "$DEMO"
          cp -R "$APP_PATH" "$DEMO/"
          DEMO_APP="$DEMO/$(basename "$APP_PATH")"
          sed -i '' 's|</head>|<script>window.FISH_AUTOPLAY="watch"</script></head>|' "$DEMO_APP/public/index.html"
          grep -q 'FISH_AUTOPLAY="watch"' "$DEMO_APP/public/index.html"
          xcrun simctl terminate "$SIM_UDID" "$APP_ID" || true
          xcrun simctl install "$SIM_UDID" "$DEMO_APP"
          # Stop filming once the screen has stood still for two looks in a
          # row: the game is over and the results card is up. A game in play
          # never stands still that long -- even on your own turn the engine
          # moves after under two seconds.
          xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 --force game.mp4 &
          REC=$!
          sleep 3
          xcrun simctl launch "$SIM_UDID" "$APP_ID"
          sleep 20
          xcrun simctl io "$SIM_UDID" screenshot game.png
          cp game.png prev.png; still=0; t=23
          while [ "$t" -lt 330 ]; do
            sleep 8; t=$((t + 8))
            xcrun simctl io "$SIM_UDID" screenshot now.png >/dev/null 2>&1
            moved=$("$PY" -c "
          from PIL import Image, ImageChops
          a = Image.open('prev.png').convert('L').resize((201, 437))
          b = Image.open('now.png').convert('L').resize((201, 437))
          d = ImageChops.difference(a, b).point(lambda v: 255 if v > 24 else 0)
          print(sum(1 for v in d.getdata() if v) / (201 * 437))")
            echo "t=${t}s  changed ${moved}"
            if [ "$t" -gt 120 ] && [ "$t" -lt 140 ]; then cp now.png middle.png; fi
            if "$PY" -c "import sys; sys.exit(0 if float('$moved') < 0.004 else 1)"; then
              still=$((still + 1)); [ "$still" -ge 2 ] && break
            else
              still=0
            fi
            cp now.png prev.png
          done
          cp now.png end.png
          # SIGINT is what makes simctl finish writing the file. Bash starts a
          # background job with SIGINT ignored, and while simctl's own handler
          # should still see it, the wait is bounded so a recorder that does
          # not stop cannot hang the job: TERM after 20 s (that video may be
          # unplayable; the screenshots and checks do not depend on it).
          kill -INT "$REC" || true
          for _ in $(seq 1 20); do kill -0 "$REC" 2>/dev/null || break; sleep 1; done
          kill -TERM "$REC" 2>/dev/null || true
          wait "$REC" || true
          echo "GAME_SECONDS=$t" >> "$GITHUB_ENV"
          ls -la game.mp4 *.png

      - name: Check the game table drew
        run: |
          set -euo pipefail
          "$PY" - <<'PY'
          import os
          from PIL import Image
          im = Image.open("game.png").convert("RGB")
          w, h = im.size
          px = (im.get_flattened_data() if hasattr(im, "get_flattened_data")
                else im.getdata())
          # The felt (#17805f to #073528) is green-dominant. Calibrated on the
          # web client at phone size: the game table 31.5%, the home screen
          # 0.5%, so 10% separates a table from a screen that never left home.
          felt = sum(1 for r, g, b in px if g > 40 and g > r + 25 and g > b + 8 and r < 60)
          frac = felt / (w * h)
          msg = (f"{frac:.1%} felt green 20 s after launching into watch mode; "
                 f"filmed {os.environ.get('GAME_SECONDS', '?')} s of play")
          print(msg)
          if frac < 0.10:
              print(f"::error title=Game table did not render::{msg}")
              raise SystemExit(1)
          print(f"::notice title=A game played itself in the iOS app::{msg}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshot
          path: |
            home.png
            game.png
            middle.png
            end.png
            game.mp4
          if-no-files-found: ignore

      - name: Surface build errors as annotations
        if: failure()
        working-directory: app/ios/App
        run: |
          set +o pipefail
          if [ -f build.log ]; then
            grep -E "error:" build.log | sort -u | head -10 | while IFS= read -r line; do
              echo "::error title=xcodebuild::${line:0:400}"
            done
            tail -5 build.log | while IFS= read -r line; do echo "::warning title=build log tail::${line:0:300}"; done
          fi
          true
