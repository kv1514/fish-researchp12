<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fish Coach</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Fish Coach <span class="sub">tells you what to play, in a real game</span></h1>
  <div class="tabs">
    <a class="tab" href="/">Simulator</a>
    <button class="tab active">Coach</button>
  </div>
</header>

<main>

<!-- ---------------------------------------------------------------- setup -->
<section id="setup" class="controls">
  <h2>Start a game</h2>
  <div class="row">
    <label>Your seat
      <select id="seat">
        <option value="0">P0 (Team A)</option>
        <option value="1">P1 (Team B)</option>
        <option value="2">P2 (Team A)</option>
        <option value="3">P3 (Team B)</option>
        <option value="4">P4 (Team A)</option>
        <option value="5">P5 (Team B)</option>
      </select>
    </label>
    <label>Deck
      <select id="variant">
        <option value="54">54 cards (with 8s + jokers)</option>
        <option value="48">48 cards (classic)</option>
      </select>
    </label>
    <label>Who leads
      <select id="starting"></select>
    </label>
    <button id="start" class="primary">Start coaching</button>
  </div>
  <p class="muted small">
    Seats go clockwise. Team A is seats 0, 2, 4; Team B is 1, 3, 5.
    Tap your dealt cards below, then press Start.
  </p>
  <div id="handpick" class="handpick"></div>
  <div class="row">
    <span id="handcount" class="chip">0 selected</span>
    <button id="clearhand">Clear</button>
    <span id="setuperr" class="chip err" hidden></span>
  </div>
</section>

<!-- ----------------------------------------------------------------- live -->
<section id="live" hidden>
  <div class="advice" id="advice"></div>

  <div class="controls">
    <h2>Log what happened</h2>
    <div class="row">
      <label>Asker <select id="e_asker"></select></label>
      <label>asked <select id="e_target"></select></label>
      <label>for <input id="e_card" list="cardlist" placeholder="6H"
                        autocomplete="off" size="8"></label>
      <datalist id="cardlist"></datalist>
      <button id="e_got" class="primary">Got it</button>
      <button id="e_no">No</button>
      <button id="undo">Undo</button>
    </div>
    <div class="row">
      <label>Claim: <select id="c_claimer"></select></label>
      <label>of <select id="c_hs"></select></label>
      <button id="c_open">Enter claim result</button>
    </div>
    <div id="claimbox" class="claimbox" hidden></div>
    <div class="row"><span id="liveerr" class="chip err" hidden></span></div>
  </div>

  <div class="lower">
    <div class="panel">
      <h2>Your hand</h2>
      <div id="myhand" class="cards"></div>
      <h2 style="margin-top:14px">Half-suits</h2>
      <div id="suits" class="suits"></div>
    </div>
    <div class="panel">
      <h2>Where the cards are</h2>
      <div id="beliefs" class="analysis"></div>
    </div>
    <div class="panel">
      <h2>What I can prove</h2>
      <div id="deductions" class="analysis"></div>
      <h2 style="margin-top:14px">Log</h2>
      <div id="log" class="log"></div>
    </div>
  </div>
</section>

</main>
<script src="/coach.js"></script>
</body>
</html>
